<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>外勤戰術 SOP 與檢核系統</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, #050811 65%);
      color: #f8fafc;
      padding-bottom: 92px;
      line-height: 1.55;
      min-height: 100vh;
    }
    header {
      position: sticky; top: 0; z-index: 99;
      background: rgba(5, 8, 17, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand {
      font-size: 1.05rem; font-weight: 800; letter-spacing: .5px;
      background: linear-gradient(90deg, #ffffff, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.16); color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .wrap { max-width: 780px; margin: 12px auto; padding: 0 14px; }
    .search-box { position: relative; margin-bottom: 12px; }
    .search-input {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      color: #f8fafc; padding: 11px 38px 11px 14px; border-radius: 12px;
      font-size: .92rem; outline: none; transition: border-color .2s;
    }
    .search-input:focus { border-color: #38bdf8; }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #94a3b8; font-size: 1rem;
      cursor: pointer; display: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px; margin-bottom: 14px;
    }
    .nav-btn {
      background: #0f172a; border: 1px solid #1e293b; color: #94a3b8;
      padding: 10px 6px; border-radius: 12px; font-size: .85rem; font-weight: 700;
      cursor: pointer; transition: all .18s; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff; border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .card {
      background: linear-gradient(180deg, #131c2e 0%, #0d1320 100%);
      border: 1px solid #1e293b; border-radius: 16px;
      padding: 16px; margin-bottom: 16px;
    }
    .card-hd {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px;
    }
    .card-hd h2 { margin: 0; font-size: 1rem; color: #38bdf8; }
    .step {
      display: flex; gap: 10px; background: rgba(5, 8, 17, 0.65);
      border: 1px solid #1e293b; border-left: 3px solid #38bdf8;
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: .92rem;
    }
    .num {
      background: rgba(56, 189, 248, 0.2); color: #38bdf8;
      font-size: .74rem; font-weight: 800; padding: 2px 7px;
      border-radius: 6px; height: fit-content; flex-shrink: 0;
    }
    .prog-bg {
      background: #050811; border: 1px solid #1e293b;
      border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 12px;
    }
    .prog-fill {
      height: 100%; background: linear-gradient(90deg, #059669, #34d399);
      transition: width .25s ease;
    }
    .chk {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px;
      border-radius: 10px; margin-bottom: 6px;
      background: rgba(5, 8, 17, 0.5); cursor: pointer; font-size: .92rem;
    }
    .chk input {
      width: 19px; height: 19px; margin-top: 2px;
      accent-color: #10b981; flex-shrink: 0;
    }
    .chk.done { background: rgba(16, 185, 129, 0.1); }
    .chk.done span { text-decoration: line-through; color: #64748b; }
    .qa-box {
      background: rgba(5, 8, 17, 0.65); border: 1px solid #1e293b;
      border-left: 3px solid #a855f7; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    }
    .qa-box:active { background: rgba(168, 85, 247, 0.12); }
    .qa-q { color: #e9d5ff; font-weight: 600; font-size: .9rem; }
    .qa-tag {
      display: inline-block; background: rgba(168, 85, 247, 0.22);
      color: #d8b4fe; font-size: .74rem; font-weight: 800;
      padding: 1px 6px; border-radius: 5px; margin-right: 6px;
    }
    .btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      font-size: .88rem; font-weight: 700; cursor: pointer;
    }
    .btn-copy { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .btn-purple { background: linear-gradient(135deg, #7e22ce, #a855f7); color: #fff; }
    .btn-rst {
      background: rgba(244, 63, 94, 0.15); color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.35); flex: .42;
    }
    .bar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 480px;
      background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(14px);
      border: 1px solid #334155; border-radius: 999px;
      display: flex; padding: 5px; z-index: 99;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    .bar button {
      flex: 1; background: none; border: none; color: #94a3b8;
      font-size: .82rem; font-weight: 700; padding: 9px 4px;
      border-radius: 999px; cursor: pointer;
    }
    .bar button.active {
      background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff;
    }
    .hl { background: rgba(250, 204, 21, 0.28); color: #fde047; padding: 0 3px; border-radius: 4px; }
    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: #042f2e; padding: 8px 18px;
      border-radius: 999px; font-size: .85rem; font-weight: 800;
      opacity: 0; pointer-events: none; transition: .25s; z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛡️ 外勤戰術 SOP 與檢核系統</div>
    <span class="badge">DARK OPS</span>
  </header>

  <div id="toast" class="toast">已複製</div>

  <div class="wrap">
    <div class="search-box">
      <input type="text" id="kwInput" class="search-input" placeholder="🔍 跨案件搜尋關鍵字（SOP / 表單 / 筆錄）..." oninput="onSearch()" />
      <button id="kwClear" class="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <nav class="grid" id="caseNav"></nav>
    <main id="mainBox"></main>
  </div>

  <div class="bar">
    <button id="t-all" class="active" onclick="setTab('all')">⚡ 全部</button>
    <button id="t-sop" onclick="setTab('sop')">📖 SOP</button>
    <button id="t-chk" onclick="setTab('chk')">✅ 檢核</button>
    <button id="t-qa" onclick="setTab('qa')">🎙️ 筆錄問句</button>
  </div>
  <script>
    window.__dataFileMissing = false;
    window.__dataSyntaxErr = "";
    window.addEventListener("error", function(e) {
      if (e.filename && e.filename.includes("data.js")) {
        window.__dataSyntaxErr = e.message + " (第 " + e.lineno + " 行)";
      }
    });
  </script>
  <script src="./data.js" onerror="window.__dataFileMissing = true;"></script>
  <script>
    const DB = (typeof DATA !== "undefined") ? DATA : (window.DATA || null);
    let curKey = localStorage.getItem("sel_case") || "";
    let curTab = "all";
    let kw = "";

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }

    function setCase(k) {
      curKey = k;
      localStorage.setItem("sel_case", k);
      clearSearch(false);
      render();
    }

    function setTab(t) {
      curTab = t;
      document.querySelectorAll(".bar button").forEach(b => b.classList.remove("active"));
      document.getElementById("t-" + t).classList.add("active");
      render();
    }

    function onSearch() {
      kw = document.getElementById("kwInput").value.trim();
      document.getElementById("kwClear").style.display = kw ? "block" : "none";
      render();
    }

    function clearSearch(doRender = true) {
      kw = "";
      document.getElementById("kwInput").value = "";
      document.getElementById("kwClear").style.display = "none";
      if (doRender) render();
    }

    function hl(txt) {
      if (!kw) return txt;
      const re = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
      return txt.replace(re, '<span class="hl">$1</span>');
    }

    function getChk(k) {
      return JSON.parse(localStorage.getItem("c_" + k) || "{}");
    }

    function togChk(k, i) {
      const s = getChk(k);
      s[i] = !s[i];
      localStorage.setItem("c_" + k, JSON.stringify(s));
      render();
    }

    function rstChk(k) {
      if (confirm("清除【" + DB[k].name + "】勾選紀錄？")) {
        localStorage.removeItem("c_" + k);
        render();
        toast("已重置勾選");
      }
    }

    function copyChk(k) {
      const d = DB[k], s = getChk(k);
      const text = `【${d.name}檢核】\n` + d.chk.map((v, i) => `${s[i] ? "☑" : "☐"} ${v}`).join("\n");
      navigator.clipboard.writeText(text).then(() => toast("✅ 已複製檢核摘要"));
    }

    function copyQA(k) {
      const d = DB[k];
      const text = `【${d.name}筆錄問句清單】\n` + (d.qa || []).map((x, i) => `${i + 1}. [${x.tag}] 問：${x.q}\n答：\n`).join("\n");
      navigator.clipboard.writeText(text).then(() => toast("🎙️ 已複製整份筆錄問句"));
    }

    function copySingleQA(qText) {
      navigator.clipboard.writeText(`問：${qText}\n答：`).then(() => toast("📋 已複製單題問句"));
    }

    function renderCard(k, isSearch = false) {
      const d = DB[k];
      const s = getChk(k);
      const done = d.chk.filter((_, i) => s[i]).length;
      const pct = d.chk.length ? Math.round((done / d.chk.length) * 100) : 0;
      const hasQA = Array.isArray(d.qa) && d.qa.length > 0;
      let h = "";

      if (isSearch) {
        h += `<div style="margin: 18px 0 8px; font-weight: 800; color: #38bdf8; font-size: .95rem;">${d.icon} ${d.name}</div>`;
      }

      if (curTab === "all" || curTab === "sop") {
        const steps = isSearch ? d.sop.filter(x => x.toLowerCase().includes(kw.toLowerCase())) : d.sop;
        if (steps.length) {
          h += `<div class="card">
            <div class="card-hd"><h2>📖 現場處置 SOP</h2><span class="badge">${steps.length} 步驟</span></div>
            ${steps.map((x, i) => `<div class="step"><span class="num">${String(i + 1).padStart(2, "0")}</span><div>${hl(x)}</div></div>`).join("")}
          </div>`;
        }
      }

      if (curTab === "all" || curTab === "chk") {
        const chks = d.chk.map((txt, idx) => ({ txt, idx })).filter(o => !isSearch || o.txt.toLowerCase().includes(kw.toLowerCase()));
        if (chks.length) {
          h += `<div class="card">
            <div class="card-hd"><h2>✅ 卷宗表單檢核</h2><span class="badge">${done}/${d.chk.length} (${pct}%)</span></div>
            <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
            ${chks.map(o => `<label class="chk ${s[o.idx] ? "done" : ""}">
              <input type="checkbox" ${s[o.idx] ? "checked" : ""} onchange="togChk('${k}', ${o.idx})" />
              <span>${hl(o.txt)}</span>
            </label>`).join("")}
            <div class="btns">
              <button class="btn btn-copy" onclick="copyChk('${k}')">📋 複製檢核摘要</button>
              <button class="btn btn-rst" onclick="rstChk('${k}')">重置</button>
            </div>
          </div>`;
        }
      }

      if (curTab === "all" || curTab === "qa") {
        if (hasQA) {
          const qas = isSearch ? d.qa.filter(x => (x.tag + x.q).toLowerCase().includes(kw.toLowerCase())) : d.qa;
          if (qas.length) {
            h += `<div class="card">
              <div class="card-hd"><h2>🎙️ 筆錄詢問要領（點擊單題可複製）</h2><span class="badge">${qas.length} 題</span></div>
              ${qas.map(x => `<div class="qa-box" onclick="copySingleQA('${x.q.replace(/'/g, "\\'")}')">
                <div class="qa-q"><span class="qa-tag">${hl(x.tag)}</span>${hl(x.q)}</div>
              </div>`).join("")}
              <div class="btns">
                <button class="btn btn-purple" onclick="copyQA('${k}')">🎙️ 一鍵複製整份筆錄問句</button>
              </div>
            </div>`;
          }
        } else if (curTab === "qa" && !isSearch) {
          h += `<div class="card" style="text-align:center; color:#94a3b8; padding:28px 16px;">
            ${d.icon} <strong>${d.name}</strong> 為現場查處／行政取締案件，無須製作警詢筆錄。
          </div>`;
        }
      }

      return h;
    }

    function render() {
      const main = document.getElementById("mainBox");
      if (!DB) {
        let reason = "請確認 data.js 與 index.html 位於同一層目錄，且檔名為全小寫 data.js。";
        if (window.__dataFileMissing) {
          reason = "❌ 找不到 ./data.js 檔案（HTTP 404），請檢查 GitHub 儲存庫根目錄是否有上傳小寫 data.js。";
        } else if (window.__dataSyntaxErr) {
          reason = "❌ data.js 檔案有找到，但內部有語法錯誤：" + window.__dataSyntaxErr;
        }
        main.innerHTML = `<div class="card" style="text-align:center; color:#f43f5e; padding:24px 16px;">
          <div style="font-weight:800; margin-bottom:8px;">⚠️ 尚未載入 data.js 資料檔</div>
          <div style="font-size:.85rem; color:#cbd5e1;">${reason}</div>
        </div>`;
        return;
      }

      const keys = Object.keys(DB);
      if (!keys.length) return;
      if (!curKey || !DB[curKey]) curKey = keys.at(0);

      document.getElementById("caseNav").innerHTML = keys.map(k => {
        const d = DB[k];
        const act = (!kw && k === curKey) ? "active" : "";
        return `<button class="nav-btn ${act}" onclick="setCase('${k}')">${d.icon} ${d.name}</button>`;
      }).join("");

      if (kw) {
        const q = kw.toLowerCase();
        const matched = keys.filter(k => {
          const d = DB[k];
          const pool = [d.name, ...d.sop, ...d.chk, ...(d.qa || []).map(x => x.tag + x.q)].join(" ").toLowerCase();
          return pool.includes(q);
        });
        main.innerHTML = matched.length
          ? matched.map(k => renderCard(k, true)).join("")
          : `<div class="card" style="text-align:center; color:#94a3b8; padding:32px 16px;">找不到符合「<span class="hl">${kw}</span>」的資料</div>`;
        return;
      }

      main.innerHTML = renderCard(curKey, false);
    }

    render();
  </script>
</body>
</html>
