<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>勤務 SOP 分層檢核</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --warn: #fbbf24;
      --ok: #34d399;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 72px;
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .top-title { font-size: 16px; font-weight: 700; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 14px; }
    .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .menu-btn {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .menu-btn:active { background: var(--card-2); border-color: var(--accent); }
    .arrow { color: var(--muted); font-size: 18px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .warn-box {
      background: #2a2412;
      border: 1px solid var(--warn);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .warn-box h3 { margin: 0 0 8px; font-size: 15px; color: var(--warn); }
    .warn-box ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
    .row {
      background: var(--card-2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }
    .qa-tap { cursor: pointer; }
    .qa-tap:active { opacity: 0.75; }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .q-text { font-size: 15px; line-height: 1.55; }
    .chk-item { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5; }
    .chk-item input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ok); }
    .law-t { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .law-c { font-size: 14px; line-height: 1.65; white-space: pre-line; }
    .copy-all {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: #0f172a;
      color: var(--ok);
      border: 1px solid var(--ok);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="top">
    <button id="backBtn" class="back" type="button" onclick="goBack()" style="display:none;">← 上一層</button>
    <div id="topTitle" class="top-title">勤務 SOP 分層檢核</div>
  </div>
  <div id="app" class="wrap"></div>
  <div id="toast" class="toast">已複製</div>
  <script src="data.js"></script>
  <script>
    const ICONS = {
      theft: "💰",
      injury: "🩹",
      damage: "🔨",
      embezzlement: "👜",
      found: "🤲",
      lost: "🔍",
      angler: "🎣",
      intimidation: "⚠️",
      stolen_moto: "🛵",
      lost_plate: "🪪"
    };

    const FALLBACK_DB = {
      theft: { name: "竊盜", hasSuspect: true, qa: [{ tag: "案情", q: "遭竊時間、地點、物品特徵與財損金額為何？" }], laws: [{ title: "刑法第 320 條", content: "意圖為自己或第三人不法之所有，而竊取他人之動產者，為竊盜罪。" }], chk: ["被害人／報案人筆錄", "現場或監視器影像資料", "贓物／財損清單"] },
      injury: { name: "傷害", hasSuspect: true, qa: [{ tag: "案情", q: "發生經過、受傷部位與是否提出告訴？" }], laws: [{ title: "刑法第 277 條", content: "傷害人之身體或健康者，處五年以下有期徒刑、拘役或五十萬元以下罰金。" }], chk: ["驗傷診斷證明書", "告訴乃論告知紀錄", "現場照片或監視器畫面"] },
      damage: { name: "毀損", hasSuspect: true, qa: [{ tag: "案情", q: "受損標的、毀損方式與修復費用估計？" }], laws: [{ title: "刑法第 354 條", content: "毀棄、損壞前二條以外之他人之物或致令不堪用，足以生損害於公眾或他人者。" }], chk: ["毀損標的現況照片", "修復估價單或權屬證明", "筆錄與監視器佐證"] },
      embezzlement: { name: "侵占", hasSuspect: true, qa: [{ tag: "案情", q: "標的物如何合法持有、何時發現未返還或遭處分？" }], laws: [{ title: "刑法第 335 條", content: "意圖為自己或第三人不法之所有，而侵占自己持有他人之物者，為侵占罪。" }], chk: ["持有關係證明文件", "催告或交接紀錄", "當事人筆錄"] },
      found: { name: "拾得遺失物", hasSuspect: false, qa: [{ tag: "拾得", q: "何時、何地拾得物品？外觀特徵與目前保管方式為何？" }], laws: [{ title: "民法第 803 條", content: "拾得遺失物者，應通知其所有人、失主、其他有受領權之人或報告警察、自治機關。" }], chk: ["拾得遺失物受理登記／收據", "物品拍照與特徵紀錄", "招領或發還紀錄"] },
      lost: { name: "遺失物", hasSuspect: false, qa: [{ tag: "遺失", q: "遺失時間、可能路線或場所與物品特徵為何？" }], laws: [{ title: "民法第 807 條", content: "遺失物自通知或招領之日起逾六個月，未經有受領權之人認領者，由拾得人取得其所有權。" }], chk: ["遺失物受理資料", "物品特徵與序號／廠牌", "後續認領或結案登錄"] },
      angler: { name: "釣客取締", hasSuspect: true, qa: [{ tag: "現場", q: "進入管制／禁止垂釣區域之時間、地點與違規行為？" }], laws: [{ title: "相關漁港／水域／公告管制規定", content: "依主管機關公告之垂釣管制區域與安全規定辦理舉發或勸導。" }], chk: ["違規現場照片或錄影", "現場公告或警戒標示照片", "舉發／移送或勸導紀錄"] },
      intimidation: { name: "恐嚇", hasSuspect: true, qa: [{ tag: "案情", q: "對方如何以加害生命、身體、自由、名譽、財產之事恐嚇？" }], laws: [{ title: "刑法第 305 條", content: "以加害生命、身體、自由、名譽、財產之事恐嚇他人，致生危害於安全者。" }], chk: ["恐嚇言詞、訊息或通聯截圖", "證人或監視器資料", "被害人心生畏懼之陳述"] },
      stolen_moto: { name: "機車失竊", hasSuspect: true, qa: [{ tag: "車輛", q: "車號、廠牌顏色、最後停放時間地點與鑰匙保管狀況？" }], laws: [{ title: "刑法第 320 條", content: "竊取機器腳踏車者，依竊盜罪章相關規定偵辦。" }], chk: ["行照或車籍資料", "失竊車輛系統登錄", "停車處周邊監視器調閱"] },
      lost_plate: { name: "號牌遺失", hasSuspect: false, qa: [{ tag: "號牌", q: "遺失號牌號碼、最後確認在車上之時間地點？" }], laws: [{ title: "道路交通安全規則", content: "號牌遺失應依規定辦理補發或換發，並注意使用狀況。" }], chk: ["車籍與號牌號碼核對", "遺失／註銷或補發相關證明", "當事人確認紀錄"] }
    };

    const externalData = (typeof DATA !== "undefined" && DATA && typeof DATA === "object")
      ? DATA
      : ((window.DATA && typeof window.DATA === "object") ? window.DATA : {});

    const DB = Object.assign({}, FALLBACK_DB, externalData);
    const state = { caseKey: null, role: null, view: null };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function copyText(txt, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => showToast(label || "已複製")).catch(() => fallbackCopy(txt, label));
      } else {
        fallbackCopy(txt, label);
      }
    }

    function fallbackCopy(txt, label) {
      const ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(label || "已複製");
    }

    function hasSuspect(item) {
      return item && item.hasSuspect !== false;
    }

    function goBack() {
      if (state.view) {
        state.view = null;
      } else if (state.role) {
        state.role = null;
      } else if (state.caseKey) {
        state.caseKey = null;
      }
      render();
    }

    function chooseCase(key) {
      state.caseKey = key;
      state.role = null;
      state.view = null;
      render();
    }

    function chooseRole(r) {
      state.role = r;
      state.view = null;
      render();
    }

    function chooseView(v) {
      state.view = v;
      render();
    }

    function renderCaseMenu(app, titleEl, backEl) {
      backEl.style.display = "none";
      titleEl.textContent = "勤務 SOP 分層檢核";
      const keys = Object.keys(DB);
      app.innerHTML = '<div class="hint">點選案件類別進入下一層</div>' + keys.map(k => {
        const icon = ICONS[k] || "📋";
        const name = (DB[k] && DB[k].name) ? DB[k].name : k;
        return `<button class="menu-btn" type="button" onclick="chooseCase('${k}')"><span>${icon} ${name}</span><span class="arrow">›</span></button>`;
      }).join("");
    }

    function renderSubMenu(app, titleEl, backEl) {
      const item = DB[state.caseKey];
      const icon = ICONS[state.caseKey] || "📋";
      backEl.style.display = "inline-block";
      titleEl.textContent = `${icon} ${item.name}`;

      if (hasSuspect(item) && !state.role) {
        app.innerHTML =
          '<div class="hint">請先選擇對象身分</div>' +
          '<button class="menu-btn" type="button" onclick="chooseRole(\'victim\')"><span>🙋 被害人／報案人／關係人</span><span class="arrow">›</span></button>' +
          '<button class="menu-btn" type="button" onclick="chooseRole(\'suspect\')"><span>⚖️ 犯罪嫌疑人</span><span class="arrow">›</span></button>';
        return;
      }

      const roleLabel = state.role === "suspect" ? "犯罪嫌疑人" : (hasSuspect(item) ? "被害人／報案人／關係人" : "案件處理");
      let html = `<div class="hint">${roleLabel} — 選擇要查看的項目</div>`;
      if (Array.isArray(item.qa) && item.qa.length) {
        html += '<button class="menu-btn" type="button" onclick="chooseView(\'qa\')"><span>📝 筆錄問句（點題複製）</span><span class="arrow">›</span></button>';
      }
      html += '<button class="menu-btn" type="button" onclick="chooseView(\'laws\')"><span>⚖️ 法條依據</span><span class="arrow">›</span></button>';
      html += '<button class="menu-btn" type="button" onclick="chooseView(\'chk\')"><span>✅ 卷宗檢核</span><span class="arrow">›</span></button>';
      app.innerHTML = html;
    }

    function renderDetail(app, titleEl, backEl) {
      const item = DB[state.caseKey];
      const icon = ICONS[state.caseKey] || "📋";
      const isSuspect = hasSuspect(item) && state.role === "suspect";
      backEl.style.display = "inline-block";

      if (state.view === "qa") {
        titleEl.textContent = `${icon} ${item.name} · 筆錄問句`;
        const list = item.qa || [];
        const allText = list.map((x, i) => `${i + 1}. [${x.tag}] ${x.q}`).join("\n");
        let html = "";
        if (isSuspect) {
          html += '<div class="warn-box"><h3>嫌疑人法定告知與程序提醒</h3><ul>' +
            '<li><strong>三項權利</strong>：得保持緘默無須違背自己之意思而為陳述；得選任辯護人；得請求調查有利之證據。</li>' +
            '<li><strong>提審法第 1 條</strong>：被逮捕、拘禁時，本人或他人得向法院聲請提審。</li>' +
            '<li><strong>夜間詢問</strong>：注意刑事訴訟法第 100-3 條規定與例外事由。</li>' +
            '</ul></div>';
        }
        html += `<button class="copy-all" type="button" onclick="copyAllQa()">📋 一鍵複製全部問句</button>`;
        html += '<div class="panel">' + list.map((x, i) => {
          const safeQ = encodeURIComponent(`${i + 1}. [${x.tag}] ${x.q}`);
          return `<div class="row qa-tap" onclick="copyEncoded('${safeQ}', '已複製第 ${i + 1} 題')"><div class="tag">${i + 1}. ${x.tag}</div><div class="q-text">${x.q}</div></div>`;
        }).join("") + "</div>";
        app.innerHTML = html;
        window._allQaCache = allText;
        return;
      }

      if (state.view === "laws") {
        titleEl.textContent = `${icon} ${item.name} · 法條依據`;
        const laws = item.laws || [];
        app.innerHTML = '<div class="panel">' + laws.map(l =>
          `<div class="row"><div class="law-t">${l.title}</div><div class="law-c">${l.content}</div></div>`
        ).join("") + "</div>";
        return;
      }

      if (state.view === "chk") {
        titleEl.textContent = `${icon} ${item.name} · 卷宗檢核`;
        const chks = item.chk || [];
        app.innerHTML = '<div class="panel">' + chks.map((c, idx) =>
          `<div class="row"><label class="chk-item"><input type="checkbox" id="chk_${state.caseKey}_${idx}" /><span>${c}</span></label></div>`
        ).join("") + "</div>";
      }
    }

    function copyEncoded(enc, label) {
      copyText(decodeURIComponent(enc), label);
    }

    function copyAllQa() {
      copyText(window._allQaCache || "", "已複製全部問句");
    }

    function render() {
      const app = document.getElementById("app");
      const titleEl = document.getElementById("topTitle");
      const backEl = document.getElementById("backBtn");
      if (!state.caseKey) {
        renderCaseMenu(app, titleEl, backEl);
      } else if (!state.view) {
        renderSubMenu(app, titleEl, backEl);
      } else {
        renderDetail(app, titleEl, backEl);
      }
    }

    render();
  </script>
</body>
</html>
