<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>外勤案件 SOP 與檢核助手</title>
  <style>
    :root { --bg:#f4f6f9; --card:#fff; --text:#1e293b; --sub:#64748b; --border:#e2e8f0; --primary:#1d4ed8; --light:#eff6ff; --accent:#0f766e; --danger:#dc2626; }
    body.dark { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --border:#334155; --primary:#3b82f6; --light:#1e3a8a; --accent:#14b8a6; --danger:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); padding-bottom:75px; line-height:1.5; }
    header { position:sticky; top:0; z-index:99; background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:1.05rem; }
    .btn-sm { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:8px; cursor:pointer; }
    .nav { display:flex; gap:8px; overflow-x:auto; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--border); }
    .nav::-webkit-scrollbar { display:none; }
    .nav-btn { flex:0 0 auto; padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-weight:600; cursor:pointer; }
    .nav-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    main { max-width:760px; margin:14px auto; padding:0 12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:14px; }
    .card-hd { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:10px; }
    .card-hd h2 { margin:0; font-size:1rem; color:var(--primary); }
    ol { margin:0; padding-left:20px; }
    li { margin-bottom:8px; }
    .chk { display:flex; align-items:flex-start; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--border); cursor:pointer; }
    .chk:last-child { border-bottom:none; }
    .chk input { width:19px; height:19px; margin-top:2px; accent-color:var(--accent); flex-shrink:0; }
    .chk.done span { text-decoration:line-through; color:var(--sub); }
    .btns { display:flex; gap:8px; margin-top:12px; }
    .btn { flex:1; padding:10px; border-radius:8px; border:none; font-weight:700; cursor:pointer; }
    .btn-copy { background:var(--accent); color:#fff; }
    .btn-reset { background:var(--bg); color:var(--danger); border:1px solid var(--border); }
    .bar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border); display:flex; padding:8px; z-index:99; }
    .bar button { flex:1; background:none; border:none; color:var(--sub); font-weight:700; padding:8px; border-radius:8px; cursor:pointer; }
    .bar button.active { background:var(--light); color:var(--primary); }
  </style>
</head>
<body>
  <header>
    <h1>📋 外勤案件 SOP 與檢核</h1>
    <button class="btn-sm" onclick="toggleTheme()">🌓 深淺色</button>
  </header>
  <nav class="nav" id="caseNav"></nav>
  <main id="mainBox"></main>
  <div class="bar">
    <button id="t-all" class="active" onclick="setTab('all')">📌 全部</button>
    <button id="t-sop" onclick="setTab('sop')">📖 SOP</button>
    <button id="t-chk" onclick="setTab('chk')">✅ 檢核表</button>
  </div>

  <script>
    const DATA = {
      lost: {
        name: "遺失物",
        sop: [
          "受理報案：確認遺失時地、物品特徵及價值，不得推諉他轄。",
          "系統登錄：開立「受（處）理案件證明單」，登錄遺失物系統（手機務必問IMEI）。",
          "影像調閱：視需要調閱周邊監視器，留意是否遭人拾走轉為侵占遺失物。",
          "後續通知：若有人拾獲送交，比對通知遺失人領回。"
        ],
        chk: ["受（處）理案件證明單", "遺失物系統登錄表", "物品特徵或購買證明（如有）", "監視器調閱紀錄（疑遭侵占時）"]
      },
      found: {
        name: "拾得物",
        sop: [
          "現場清點：當面與拾得人清點數量、現金金額並拍照存證。",
          "開立收據：主動開立「拾得物收據」交付拾得人（除非拒留資料）。",
          "系統公告：登錄拾得物系統公告招領（500元以下適用簡易招領）。",
          "通知領回：有證件或聯絡方式者通知失主領回，具領時簽立領據。"
        ],
        chk: ["拾得物收據（拾得人簽名）", "清點照片（現金拍面額總數）", "拾得物系統登錄資料", "遺失人領據及證件影本（發還時）"]
      },
      fishing: {
        name: "釣客取締",
        sop: [
          "現場蒐證：密錄器全程錄影，拍攝垂釣行為、釣具及「禁止垂釣告示牌」。",
          "盤查身分：依警職法查證並抄登違規人完整年籍與聯絡方式。",
          "區分法規：依場域適用商港法、漁港法、水利法或道交條例（橋梁妨礙交通）。",
          "函送裁罰：檢附蒐證照片、訪談紀錄表陳報分局函送主管機關裁罰。"
        ],
        chk: ["蒐證照片黏貼表（告示牌與垂釣同框）", "現場訪談／查處紀錄表", "密錄器影像光碟", "函送主管機關公文稿"]
      },
      theft: {
        name: "竊案",
        sop: [
          "現場保全：拉設封鎖線保全指紋鞋印，住宅或加重竊盜通報鑑識採證。",
          "製作筆錄：製作被害人警詢筆錄，詳載失竊品項特徵與財損金額。",
          "調閱影像：調閱案發地及沿線路口監視器，鎖定犯嫌特徵與交通工具。",
          "開單移送：開立受（處）理案件證明單，全卷移送偵查隊續辦。"
        ],
        chk: ["刑案陳報單／偵查報告", "被害人警詢筆錄", "受（處）理案件證明單", "失竊物品清單", "現場採證照片表", "監視器影像光碟及翻拍照片"]
      },
      moto_theft: {
        name: "機車失竊",
        sop: [
          "排除烏龍：先致電拖吊場確認非違停拖吊，並確認非記錯位置或家人騎走。",
          "立即通報：確認車號、廠牌顏色後通報勤指中心攔查，輸入「失車系統」協尋。",
          "開單調閱：製作筆錄並開立案件證明單，調閱停車周邊監視器追查去向。",
          "尋獲撤尋：尋獲時通知鑑識採證、通知車主領回填具領據並辦理系統撤尋。"
        ],
        chk: ["車主報案警詢筆錄", "受（處）理案件證明單", "失竊車輛電腦輸入單", "車籍資料查詢單", "周邊監視器調閱紀錄與照片", "尋獲領據及撤尋資料（尋獲時）"]
      },
      plate_lost: {
        name: "車牌遺失",
        sop: [
          "區分態樣：判斷係「螺絲鬆脫掉落遺失」或「遭人拔走失竊（檢視鎖孔撬痕）」。",
          "排除扣牌：查詢車籍確認非遭交通違規扣牌執行後謊報遺失。",
          "開立證明：遺失者開立「受（處）理案件證明單」，告知持單至監理站重領新牌。",
          "涉竊協尋：若遭竊取則依「竊案」受理，立即輸入失竊車牌系統通報攔查。"
        ],
        chk: ["受（處）理案件證明單", "車籍資料查詢單", "車牌架鎖孔照片（疑遭拆竊時）"]
      },
      embezzlement: {
        name: "侵占案",
        sop: [
          "確認要件：確認行為人「合法持有在先」或「拾得遺失物」後拒不歸還。",
          "蒐集證據：附卷借據、租賃契約、LINE 催討截圖、帳冊或監視器撿走畫面。",
          "通知到案：查明嫌疑人身分後寄發通知書通知到案製作警詢筆錄。",
          "函送偵辦：侵占遺失物（刑337）屬非告訴乃論，全卷彙整函送地檢署。"
        ],
        chk: ["刑案陳報單／偵查報告", "告訴人（被害人）警詢筆錄", "嫌疑人警詢筆錄及權利告知書", "受（處）理案件證明單", "契約／LINE催討截圖／監視器光碟"]
      },
      intimidation: {
        name: "恐嚇案",
        sop: [
          "篩檢家暴：若雙方為家庭成員或親密伴侶，併依家暴法通報與危險評估。",
          "還原原話：筆錄一字不漏記載加害生命、身體、自由、名譽、財產言詞及畏懼感。",
          "保全證據：擷取完整對話截圖（含帳號ID與時間軸）、通話錄音或現場監視器。",
          "查緝移送：現行犯當場逮捕查扣凶器；非現行犯通知到案後函送地檢署。"
        ],
        chk: ["刑案陳報單／偵查報告", "被害人警詢筆錄（載明恐嚇原話）", "嫌疑人警詢筆錄及權利告知書", "受（處）理案件證明單", "對話截圖／錄音譯文及光碟", "家暴或跟騷通報表（符合要件時）"]
      },
      traffic: {
        name: "交通事故",
        sop: [
          "安全警戒：擺放交通錐與警告牌防二次追撞，有人受傷（A2）優先通報119送醫。",
          "現場測繪：拍攝遠中近景、車損、標線與煞車痕，繪製現場圖後移置車輛。",
          "酒毒測試：對雙方駕駛實施酒測（全程錄影），觀察有無毒駕徵候。",
          "交付聯單：製作談話紀錄表，當場發給「道路交通事故當事人登記聯單」。"
        ],
        chk: ["道路交通事故現場圖", "調查報告表（一）、（二）", "現場照片黏貼表（遠中近景）", "當事人酒精測定紀錄表", "當事人談話紀錄表", "當事人登記聯單（存根聯）", "行車紀錄器／監視器光碟"]
      }
    };

    let curKey = localStorage.getItem("sel_case") || "lost";
    let curTab = "all";
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    function setCase(k) {
      curKey = k;
      localStorage.setItem("sel_case", k);
      render();
    }

    function setTab(t) {
      curTab = t;
      document.querySelectorAll(".bar button").forEach(b => b.classList.remove("active"));
      document.getElementById("t-" + t).classList.add("active");
      render();
    }

    function getChk(k) {
      return JSON.parse(localStorage.getItem("c_" + k) || "{}");
    }

    function togChk(k, i) {
      const s = getChk(k);
      s[i] = !s[i];
      localStorage.setItem("c_" + k, JSON.stringify(s));
      render();
    }

    function rstChk(k) {
      if (confirm("確定清除【" + DATA[k].name + "】的勾選進度？")) {
        localStorage.removeItem("c_" + k);
        render();
      }
    }

    function copyChk(k) {
      const d = DATA[k], s = getChk(k);
      const txt = `【${d.name}檢核摘要】\n` + d.chk.map((v, i) => `${s[i] ? "☑" : "☐"} ${v}`).join("\n");
      navigator.clipboard.writeText(txt).then(() => alert("已複製檢核摘要！"));
    }

    function render() {
      document.getElementById("caseNav").innerHTML = Object.keys(DATA).map(k =>
        `<button class="nav-btn ${k === curKey ? "active" : ""}" onclick="setCase('${k}')">${DATA[k].name}</button>`
      ).join("");

      const d = DATA[curKey], s = getChk(curKey);
      const done = d.chk.filter((_, i) => s[i]).length;
      let html = "";

      if (curTab === "all" || curTab === "sop") {
        html += `<div class="card"><div class="card-hd"><h2>📖 ${d.name}｜處置 SOP</h2></div><ol>${d.sop.map(x => `<li>${x}</li>`).join("")}</ol></div>`;
      }
      if (curTab === "all" || curTab === "chk") {
        html += `<div class="card"><div class="card-hd"><h2>✅ ${d.name}｜卷宗檢核</h2><span style="color:var(--accent);font-weight:700">${done}/${d.chk.length}</span></div>` +
          d.chk.map((x, i) => `<label class="chk ${s[i] ? "done" : ""}"><input type="checkbox" ${s[i] ? "checked" : ""} onchange="togChk('${curKey}',${i})"><span>${i + 1}. ${x}</span></label>`).join("") +
          `<div class="btns"><button class="btn btn-copy" onclick="copyChk('${curKey}')">📋 複製摘要</button><button class="btn btn-reset" onclick="rstChk('${curKey}')">🗑️ 清除重勾</button></div></div>`;
      }
      document.getElementById("mainBox").innerHTML = html;
    }

    render();
  </script>
</body>
</html>
