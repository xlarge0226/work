<!DOCTYPE html>

    .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .btn-copy { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .btn-purple { background: linear-gradient(135deg, #7e22ce, #a855f7); color: #fff; }

    .hl { background: rgba(250,204,21,.28); color: #fde047; padding: 0 3px; border-radius: 4px; }
    .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: #10b981; color: #042f2e; padding: 8px 18px; border-radius: 999px; font-size: .85rem; font-weight: 800; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }

</head>
