<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>筆錄・法條・卷宗檢核</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #070b14; color: #f8fafc;
      padding-bottom: 90px; line-height: 1.5;
    }
    header {
      position: sticky; top: 0; z-index: 50;
      background: #0b1120; border-bottom: 1px solid #1e293b;
      padding: 12px 16px; display: flex; justify-content: space-between;
    }
    .brand { font-weight: 800; color: #38bdf8; }
    .badge {
      font-size: .75rem; padding: 2px 8px; border-radius: 999px;
      background: rgba(56,189,248,.15); color: #38bdf8;
    }
    .wrap { max-width: 760px; margin: 12px auto; padding: 0 12px; }
    .in {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      color: #fff; padding: 10px 12px; border-radius: 10px; font-size: .9rem;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px; margin: 12px 0;
    }
    .nav-btn {
      background: #0f172a; border: 1px solid #1e293b; color: #94a3b8;
      padding: 9px 6px; border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .nav-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .card {
      background: #111827; border: 1px solid #1e293b;
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
    }
    .hd {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1e293b; padding-bottom: 8px; margin-bottom: 10px;
    }
    .hd h2 { margin: 0; font-size: .98rem; color: #38bdf8; }
    .box {
      background: #090d16; border: 1px solid #1e293b;
      border-left: 3px solid #a855f7; border-radius: 8px;
      padding: 10px; margin-bottom: 8px; cursor: pointer;
    }
    .law { border-left-color: #f59e0b; cursor: default; }
    .rights {
      background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.35);
      border-left: 4px solid #f43f5e; border-radius: 10px;
      padding: 10px; margin-bottom: 10px;
    }
    .chk { display: flex; gap: 8px; padding: 8px; cursor: pointer; }
    .chk.done span { text-decoration: line-through; color: #64748b; }
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      font-weight: 700; color: #fff; background: #7e22ce; cursor: pointer; margin-top: 8px;
    }
    .btn-g { background: #059669; }
    .bar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 480px; background: #0f172a;
      border: 1px solid #334155; border-radius: 999px; display: flex; padding: 4px;
    }
    .bar button {
      flex: 1; background: none; border: none; color: #94a3b8;
      padding: 8px 4px; border-radius: 999px; font-weight: 700; cursor: pointer;
    }
    .bar button.active { background: #0284c7; color: #fff; }
    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: #042f2e; padding: 6px 16px;
      border-radius: 999px; font-weight: 800; display: none; z-index: 99;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">筆錄・法條・卷宗檢核</div>
    <span class="badge">OPS</span>
  </header>
  <div id="toast" class="toast">已複製</div>
  <div class="wrap">
    <input id="kw" class="in" placeholder="搜尋筆錄 / 法條 / 卷宗..." oninput="render()" />
    <nav id="nav" class="grid"></nav>
    <main id="main"></main>
  </div>
  <div class="bar">
    <button id="b-all" class="active" onclick="setTab('all')">全部</button>
    <button id="b-qa" onclick="setTab('qa')">筆錄</button>
    <button id="b-law" onclick="setTab('law')">法條</button>
    <button id="b-chk" onclick="setTab('chk')">卷宗檢核</button>
  </div>
  <script src="./data.js"></script>
  <script>
    const RIGHTS = [
      { t: "三項權利", q: "依刑事訴訟法第95條告知你：（一）得保持緘默，無須違背自己之意思而為陳述；（二）得選任辯護人，如為低收入戶、中低收入戶、原住民或其他依法令得請求法律扶助者，得請求之；（三）得請求調查有利之證據。以上權利是否均已明瞭？是否需要選任辯護人？" },
      { t: "提審法第1條", q: "依提審法第1條告知你：人民被法院以外之任何機關逮捕、拘禁時，其本人或他人得向逮捕、拘禁地之地方法院聲請提審。是否清楚？" },
      { t: "夜間詢問", q: "依刑事訴訟法第100條之3規定，原則上不得於夜間詢問；惟經你明示同意者，不在此限。請問你是否同意於夜間接受詢問？" }
    ];

    const RAW = (typeof DATA !== "undefined") ? DATA : {};
    const DB = {};
    for (const [k, v] of Object.entries(RAW)) {
      const n = String((v && v.name) || "");
      if (k.toLowerCase().includes("185") || k.toLowerCase().includes("dui") || n.includes("公共危險")) continue;
      DB[k] = { name: n || k, laws: v.laws || [], chk: v.chk || [], qa: v.qa || [] };
    }

    let curKey = localStorage.getItem("k_case") || Object.keys(DB)[0] || "";
    let curTab = "all";
    let role = localStorage.getItem("k_role") || "suspect";

    function toast(m) {
      const el = document.getElementById("toast");
      el.textContent = m; el.style.display = "block";
      setTimeout(() => el.style.display = "none", 1500);
    }
    function cp(t, m) { navigator.clipboard.writeText(t).then(() => toast(m || "已複製")); }
    function setCase(k) { curKey = k; localStorage.setItem("k_case", k); render(); }
    function setTab(t) {
      curTab = t;
      document.querySelectorAll(".bar button").forEach(b => b.classList.remove("active"));
      document.getElementById("b-" + t).classList.add("active");
      render();
    }
    function setRole(r) { role = r; localStorage.setItem("k_role", r); render(); }
    function getChk(k) { return JSON.parse(localStorage.getItem("c_" + k) || "{}"); }
    function tog(k, i) { const s = getChk(k); s[i] = !s[i]; localStorage.setItem("c_" + k, JSON.stringify(s)); render(); }
    function copyAllQA(k) {
      const list = (role === "suspect") ? [...RIGHTS.map(r => ({ tag: r.t, q: r.q })), ...DB[k].qa] : DB[k].qa;
      cp(`【${DB[k].name}筆錄】\n` + list.map((x, i) => `${i + 1}. [${x.tag}] 問：${x.q}\n答：\n`).join("\n"), "已複製整份筆錄");
    }
    function copyAllChk(k) {
      const s = getChk(k);
      cp(`【${DB[k].name}卷宗檢核】\n` + DB[k].chk.map((v, i) => `${s[i] ? "☑" : "☐"} ${v}`).join("\n"), "已複製檢核表");
    }
    function render() {
      const keys = Object.keys(DB), main = document.getElementById("main");
      if (!keys.length) { main.innerHTML = "<div class='card'>請確認 data.js 已建立</div>"; return; }
      if (!DB[curKey]) curKey = keys[0];
      const kw = document.getElementById("kw").value.trim().toLowerCase();
      document.getElementById("nav").innerHTML = keys.map(k => `<button class="nav-btn ${!kw && k === curKey ? "active" : ""}" onclick="setCase('${k}')">${DB[k].name}</button>`).join("");
      const showKeys = kw ? keys.filter(k => JSON.stringify(DB[k]).toLowerCase().includes(kw)) : [curKey];
      main.innerHTML = showKeys.map(k => {
        const d = DB[k], s = getChk(k); let h = kw ? `<h3 style="color:#38bdf8">${d.name}</h3>` : "";
        if (curTab === "all" || curTab === "qa") {
          h += `<div class="card"><div class="hd"><h2>🎙️ 筆錄工具（點擊單題複製）</h2></div>
            <div style="display:flex;gap:6px;margin-bottom:10px">
              <button class="nav-btn ${role === "suspect" ? "active" : ""}" style="flex:1" onclick="setRole('suspect')">嫌疑人</button>
              <button class="nav-btn ${role === "victim" ? "active" : ""}" style="flex:1" onclick="setRole('victim')">告訴／被害人</button>
              <button class="nav-btn ${role === "witness" ? "active" : ""}" style="flex:1" onclick="setRole('witness')">證人</button>
            </div>
            ${role === "suspect" ? `<div class="rights"><div style="color:#fda4af;font-weight:700;margin-bottom:6px">法定權利告知</div>` + RIGHTS.map(r => `<div class="box" style="border-left-color:#f43f5e" onclick="cp('問：${r.q}\\n答：')"><b>[${r.t}]</b> ${r.q}</div>`).join("") + `</div>` : ""}
            ${d.qa.map((x, i) => `<div class="box" onclick="cp('問：${x.q}\\n答：')"><b>${i + 1}. [${x.tag}]</b> ${x.q}</div>`).join("")}
            <button class="btn" onclick="copyAllQA('${k}')">一鍵複製整份筆錄</button></div>`;
        }
        if (curTab === "all" || curTab === "law") {
          h += `<div class="card"><div class="hd"><h2>⚖️ 相關法條</h2></div>` + d.laws.map(l => `<div class="box law"><b style="color:#fbbf24">${l.title}</b><div style="white-space:pre-line;margin-top:4px">${l.content}</div></div>`).join("") + `</div>`;
        }
        if (curTab === "all" || curTab === "chk") {
          h += `<div class="card"><div class="hd"><h2>✅ 卷宗檢核</h2></div>` + d.chk.map((c, i) => `<label class="chk ${s[i] ? "done" : ""}"><input type="checkbox" ${s[i] ? "checked" : ""} onchange="tog('${k}',${i})"><span>${c}</span></label>`).join("") + `<button class="btn btn-g" onclick="copyAllChk('${k}')">複製卷宗檢核</button></div>`;
        }
        return h;
      }).join("") || "<div class='card'>查無資料</div>";
    }
    render();
  </script>
</body>
</html>
