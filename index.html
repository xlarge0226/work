<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>外勤戰術 SOP 與檢核系統</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #070b14 60%); color: #f8fafc; padding-bottom: 88px; line-height: 1.55; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 99; background: rgba(7,11,20,.9); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.05rem; font-weight: 800; background: linear-gradient(90deg, #fff, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(56,189,248,.2); color: #38bdf8; border: 1px solid rgba(56,189,248,.4); }
    .wrap { max-width: 760px; margin: 12px auto; padding: 0 14px; }
    .search-box { position: relative; margin-bottom: 12px; }
    .search-input { width: 100%; background: #111827; border: 1px solid #334155; color: #f8fafc; padding: 11px 38px 11px 14px; border-radius: 12px; font-size: .92rem; outline: none; }
    .search-input:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56,189,248,.25); }
    .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; font-size: 1rem; cursor: pointer; display: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .nav-btn { background: #111827; border: 1px solid #1e293b; color: #94a3b8; padding: 10px 6px; border-radius: 12px; font-size: .88rem; font-weight: 700; cursor: pointer; transition: .2s; }
    .nav-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,.35); }
    .card { background: linear-gradient(180deg, #162033 0%, #111827 100%); border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .card-hd { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .card-hd h2 { margin: 0; font-size: 1.02rem; color: #38bdf8; }
    .step { display: flex; gap: 10px; background: rgba(7,11,20,.6); border: 1px solid #1e293b; border-left: 3px solid #38bdf8; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: .92rem; }
    .num { background: rgba(56,189,248,.2); color: #38bdf8; font-size: .75rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; height: fit-content; }
    .qa-box { background: rgba(7,11,20,.6); border: 1px solid #1e293b; border-left: 3px solid #a855f7; border-radius: 10px; padding: 11px 12px; margin-bottom: 9px; }
    .qa-q { color: #d8b4fe; font-weight: 700; font-size: .92rem; margin-bottom: 4px; }
    .qa-a { color: #94a3b8; font-size: .86rem; }
    .prog-bg { background: #070b14; border: 1px solid #1e293b; border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 12px; }
    .prog-fill { height: 100%; background: linear-gradient(90deg, #059669, #34d399); transition: width .25s; }
    .chk { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 10px; margin-bottom: 6px; background: rgba(7,11,20,.45); cursor: pointer; }
    .chk input { width: 20px; height: 20px; margin-top: 2px; accent-color: #10b981; flex-shrink: 0; }
    .chk.done { background: rgba(16,185,129,.1); }
    .chk.done span { text-decoration: line-through; color: #64748b; }
    .btns { display: flex; gap: 10px; margin-top: 14px; }
    .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: .9rem; font-weight: 700; cursor: pointer; }
    .btn-copy { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .btn-purple { background: linear-gradient(135deg, #7e22ce, #a855f7); color: #fff; }
    .btn-rst { background: rgba(244,63,94,.15); color: #f43f5e; border: 1px solid rgba(244,63,94,.35); flex: .45; }
    .bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: calc(100% - 28px); max-width: 480px; background: rgba(17,24,39,.92); backdrop-filter: blur(14px); border: 1px solid #334155; border-radius: 999px; display: flex; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.7); z-index: 99; }
    .bar button { flex: 1; background: none; border: none; color: #94a3b8; font-size: .82rem; font-weight: 700; padding: 9px 4px; border-radius: 999px; cursor: pointer; }
    .bar button.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; }
    .hl { background: rgba(250,204,21,.28); color: #fde047; padding: 0 3px; border-radius: 4px; }
    .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: #10b981; color: #042f2e; padding: 8px 18px; border-radius: 999px; font-size: .85rem; font-weight: 800; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛡️ 外勤戰術 SOP 與檢核系統</div>
    <span class="badge">DARK OPS</span>
  </header>
  <div id="toast" class="toast">已複製</div>
  <div class="wrap">
    <div class="search-box">
      <input type="text" id="kwInput" class="search-input" placeholder="🔍 跨案件搜尋關鍵字（如：IMEI、商港法、家暴、A2...）" oninput="onSearch()" />
      <button id="kwClear" class="search-clear" onclick="clearSearch()">✕</button>
    </div>
    <nav class="grid" id="caseNav"></nav>
    <main id="mainBox"></main>
  </div>
  <div class="bar">
    <button id="t-all" class="active" onclick="setTab('all')">⚡ 全部</button>
    <button id="t-sop" onclick="setTab('sop')">📖 SOP</button>
    <button id="t-chk" onclick="setTab('chk')">✅ 檢核</button>
    <button id="t-qa" onclick="setTab('qa')">🎙️ 筆錄範例</button>
  </div>
  <script src="data.js"></script>
  <script>
    let curKey = localStorage.getItem("sel_case") || "lost", curTab = "all", kw = "";
    function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1800); }
    function setCase(k) { curKey = k; localStorage.setItem("sel_case", k); clearSearch(false); render(); }
    function setTab(t) { curTab = t; document.querySelectorAll(".bar button").forEach(b => b.classList.remove("active")); document.getElementById("t-" + t).classList.add("active"); render(); }
    function onSearch() { kw = document.getElementById("kwInput").value.trim(); document.getElementById("kwClear").style.display = kw ? "block" : "none"; render(); }
    function clearSearch(doRender = true) { kw = ""; document.getElementById("kwInput").value = ""; document.getElementById("kwClear").style.display = "none"; if (doRender) render(); }
    function hl(txt) { if (!kw) return txt; const re = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'); return txt.replace(re, '<span class="hl">$1</span>'); }
    function getChk(k) { return JSON.parse(localStorage.getItem("c_" + k) || "{}"); }
    function togChk(k, i) { const s = getChk(k); s[i] = !s[i]; localStorage.setItem("c_" + k, JSON.stringify(s)); render(); }
    function rstChk(k) { if (confirm("清除【" + DATA[k].name + "】勾選？")) { localStorage.removeItem("c_" + k); render(); toast("已重置"); } }
    function copyChk(k) { const d = DATA[k], s = getChk(k); navigator.clipboard.writeText(`【${d.name}檢核】\n` + d.chk.map((v, i) => `${s[i] ? "☑" : "☐"} ${v}`).join("\n")).then(() => toast("✅ 已複製檢核摘要")); }
    function copyQA(k) { const d = DATA[k]; navigator.clipboard.writeText(`【${d.name}筆錄問答範例】\n` + (d.qa || []).map(x => `問：${x.q}\n答：${x.a}`).join("\n\n")).then(() => toast("🎙️ 已複製筆錄範例")); }
    function renderCard(k, isSearch = false) {
      const d = DATA[k], s = getChk(k), done = d.chk.filter((_, i) => s[i]).length, pct = Math.round((done / d.chk.length) * 100);
      let h = "";
      if (isSearch || curTab === "all" || curTab === "sop") h += `<div class="card"><div class="card-hd"><h2>${d.icon} ${d.name}｜處置 SOP</h2></div>` + d.sop.map((x, i) => `<div class="step"><span class="num">0${i + 1}</span><div>${hl(x)}</div></div>`).join("") + `</div>`;
      if (!isSearch && (curTab === "all" || curTab === "chk")) h += `<div class="card"><div class="card-hd"><h2>✅ ${d.name}｜卷宗檢核</h2><span style="color:#34d399;font-weight:800">${done}/${d.chk.length} (${pct}%)</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>` + d.chk.map((x, i) => `<label class="chk ${s[i] ? "done" : ""}"><input type="checkbox" ${s[i] ? "checked" : ""} onchange="togChk('${k}',${i})"><span>${i + 1}. ${x}</span></label>`).join("") + `<div class="btns"><button class="btn btn-copy" onclick="copyChk('${k}')">📋 複製檢核</button><button class="btn btn-rst" onclick="rstChk('${k}')">重置</button></div></div>`;
      if (isSearch || curTab === "all" || curTab === "qa") {
        const qaList = d.qa || [];
        h += `<div class="card"><div class="card-hd"><h2>🎙️ ${d.name}｜筆錄問答範例</h2></div>` + (qaList.length ? qaList.map(x => `<div class="qa-box"><div class="qa-q">問：${hl(x.q)}</div><div class="qa-a">答：${hl(x.a)}</div></div>`).join("") + `<div class="btns"><button class="btn btn-purple" onclick="copyQA('${k}')">📋 複製筆錄問答</button></div>` : `<div style="color:#64748b;font-size:.9rem">尚待補充筆錄範例</div>`) + `</div>`;
      }
      return h;
    }
    function render() {
      document.getElementById("caseNav").style.display = kw ? "none" : "grid";
      document.getElementById("caseNav").innerHTML = Object.keys(DATA).map(k => `<button class="nav-btn ${k === curKey ? "active" : ""}" onclick="setCase('${k}')">${DATA[k].icon} ${DATA[k].name}</button>`).join("");
      if (kw) {
        const hits = Object.keys(DATA).filter(k => JSON.stringify(DATA[k]).toLowerCase().includes(kw.toLowerCase()));
        document.getElementById("mainBox").innerHTML = hits.length ? hits.map(k => renderCard(k, true)).join("") : `<div class="card" style="text-align:center;color:#94a3b8">找不到符合「${kw}」的項目</div>`;
      } else {
        document.getElementById("mainBox").innerHTML = renderCard(curKey, false);
      }
    }
    render();
  </script>
</body>
</html>
